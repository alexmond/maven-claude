name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # Java 17 bytecode; the plugin runs inside the user's Maven, so check each supported JDK.
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      # verify = lint gates + unit tests + the src/it end-to-end builds (maven-invoker-plugin)
      - name: Build with Maven
        run: ./mvnw -B verify --no-transfer-progress
      - name: Upload IT build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-logs-java-${{ matrix.java }}
          path: |
            target/it/*/build.log
            target/it/*/target/claude/
